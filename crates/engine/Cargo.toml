[package]
name = "setsuna-engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.3.1"
description = "Inference-only kana-kanji conversion engine: a CTC-NAT model (its weights for the engine's own implementation), loaded through a manifest, run as proposal -> CTC beam (or AR decoder) -> candidates, as a library or a stdio daemon."

[lib]
name = "setsuna_engine"
path = "src/lib.rs"

[[bin]]
name = "setsuna-engine"
path = "src/bin/main.rs"

[dependencies]
setsuna-artifact = { path = "../artifact" }
# `--analyzer`: the daemon answers `analyze` requests too
setsuna-analyzer = { path = "../analyzer" }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
ndarray = "0.16"
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"

# `serve`: the pipe shared with the IME's client (setsuna-core) and its server loop.
[target.'cfg(windows)'.dependencies]
setsuna-pipe = { path = "../pipe" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# `cpu`: the process's affinity (Linux); the daemon's exit (`_exit`)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
