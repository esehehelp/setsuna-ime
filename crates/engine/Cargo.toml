[package]
name = "setsuna-engine"
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.3.0"
description = "Inference-only kana-kanji conversion engine: a CTC-NAT model (ONNX), loaded through a manifest, run as proposal -> CTC beam -> candidates, as a library or a stdio daemon."

[lib]
name = "setsuna_engine"
path = "src/lib.rs"

[[bin]]
name = "setsuna-engine"
path = "src/bin/main.rs"

[dependencies]
setsuna-artifact = { path = "../artifact" }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
# The runtime is loaded at run time (`runtime.rs`): Microsoft's official
# build, not the one `download-binaries` bundles, which was measurably slower.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
rayon = "1"
ndarray = "0.16"
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"

# `serve`: the pipe shared with the IME's client (setsuna-core) and its server loop.
[target.'cfg(windows)'.dependencies]
setsuna-pipe = { path = "../pipe" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# `cpu`: the process's affinity
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
