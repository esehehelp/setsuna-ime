[package]
name = "setsuna-settings"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "Cross-platform settings GUI for the Setsuna frontends: a web page in the system webview that edits config.toml and the learned choices, and signs the rewriter in to its model server."

# The page's config and dictionary messages, without a window: the desktop
# app below and the Android app (crates/android) answer them with it.
[lib]
name = "setsuna_settings"
path = "src/lib.rs"

[[bin]]
name = "setsuna-settings"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The desktop window and the rewriter's sign-in, keys and models.
gui = ["dep:wry", "dep:tao", "dep:setsuna-rewrite"]

[dependencies]
setsuna-core = { path = "../ime-core" }
setsuna-rewrite = { path = "../rewrite", optional = true }
serde_json.workspace = true
# The system webview (WebView2 / WKWebView / WebKitGTK), so the text is drawn
# by the platform's font rendering.
wry = { version = "=0.57.0", optional = true }
tao = { version = "=0.37.1", optional = true }

[dev-dependencies]
toml.workspace = true
