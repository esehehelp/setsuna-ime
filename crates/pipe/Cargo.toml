[package]
name = "setsuna-pipe"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "The named pipes the shared `setsuna-engine serve` and `setsuna-rerank serve` processes listen on for every app of a Windows login: their names, the Win32 calls of both ends and the server loop."

[lib]
name = "setsuna_pipe"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
