[package]
name = "setsuna-analyzer"
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.1.0"
description = "Morphological analysis (a vibrato lattice and CRF costs), loaded through an analyzer manifest: text -> words with their readings."

[lib]
