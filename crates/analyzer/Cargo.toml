[package]
name = "setsuna-analyzer"
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.1.0"
description = "Morphological analysis (a vibrato lattice and CRF costs), loaded through an analyzer manifest: text -> words with their readings."

[lib]
name = "setsuna_analyzer"
path = "src/lib.rs"

[dependencies]
setsuna-artifact = { path = "../artifact" }
anyhow.workspace = true
serde.workspace = true
vibrato = { version = "0.5", default-features = false }
# the packed dictionaries' layout (vendor/vibrato-packed/VENDORED.md)
vibrato-packed = { path = "../../vendor/vibrato-packed", default-features = false }
serde_json.workspace = true
zstd = "0.13"
# the other readings' table is mapped, not read
memmap2 = "0.9"

