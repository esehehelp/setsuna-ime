[package]
name = "setsuna-tsf-shim"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "The TSF text service registered in the IME DLL's place: it forwards TSF's calls to a text service of the IME DLL (the core) and swaps it for a newer core's while the app runs."

[lib]
name = "setsuna_tsf_shim"
path = "src/lib.rs"
# Links nothing of the IME: the core is loaded by its path and reached by
# its exports (SetsunaCoreCreate, SetsunaCoreComposing).
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
