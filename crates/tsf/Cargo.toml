[package]
name = "setsuna-tsf"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "Windows TSF (Text Services Framework) IME DLL for Setsuna"

[lib]
name = "setsuna_tsf"
path = "src/lib.rs"
# The engine never links it: the two talk only through the daemon's stdio
# protocol.
crate-type = ["cdylib"]

[dependencies]
# The IME logic shared with the other frontends. It never links the engine
# either: it talks to a separate `setsuna-engine daemon` child process over
# a stdio JSONL protocol.
setsuna-core = { path = "../ime-core" }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The TSF DLL itself is Windows-only; on other platforms the crate builds
# (nearly) empty.
[target.'cfg(windows)'.dependencies]
# Whether the host is an AppContainer (a Store app's sandbox).
setsuna-pipe = { path = "../pipe" }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
