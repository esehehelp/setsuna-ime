[package]
name = "setsuna-bench"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "Benchmark of the IME as a whole: its own sets typed through the IME session (any platform) or through a real Windows input method (TSF), scored for accuracy, latency, CPU, memory and storage."

[[bin]]
name = "setsuna-bench"
path = "src/main.rs"

[dependencies]
setsuna-core = { path = "../ime-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
