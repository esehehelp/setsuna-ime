# The IME as the installer sets it up (its model, the reading lexicon, mixed
# input), with nothing of the user's: read by `setsuna-bench harness --config`
# in a Kairo task, each KAIRO_INPUT_* variable below the directory of that
# input (kairo.toml). The harness turns learning, prediction and the rewriter
# off.

[engine]
engine_exe = "${KAIRO_INPUT_BUILD}/bin/setsuna-engine.exe"
model_manifest = "${KAIRO_INPUT_MODEL}/Cymbidium-v1.1-xsmall.manifest.json"

[frontend]
mixed_model = "crates/ime-core/data/mixed"

[lexicon]
file = "${KAIRO_INPUT_LEXICON}/lexicon-v2.lexicon"

[learning]
enabled = false

[rewriter]
enabled = false
