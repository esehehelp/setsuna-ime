[workspace]
resolver = "2"
members = ["crates/*"]
# vibrato with a smaller dictionary layout (vendor/vibrato-packed/VENDORED.md),
# a dependency of crates/analyzer kept as published
exclude = ["vendor/vibrato-packed"]

[workspace.package]
edition = "2021"
version = "0.2.3"
license = "MIT"
repository = "https://github.com/esehehelp/setsuna-ime"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
